<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS</title>
<meta name="theme-color" content="#07080b">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/phone/manifest.webmanifest">
<link rel="icon" href="/phone/icon-192.png">
<link rel="apple-touch-icon" href="/phone/icon-192.png">
<link rel="stylesheet" href="/phone/relays.css">
<style>
:root{--bg:#07080b;--card:#0d0f14;--line:#1f232b;--ink:#e8e8ed;--ink-2:#a1a1aa;--ink-3:#6b6b73;
  --cyan:#5ce1ff;--amber:#ffb020;--fault:#ff5a5a;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;letter-spacing:.5px}
h2{font:600 12px var(--mono);letter-spacing:1px;color:var(--ink-2);text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;
  font:600 11px var(--mono);color:var(--ink-2)}
.pill .led{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.live .led{background:var(--cyan)}
.pill.fault .led{background:var(--fault)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
input,textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#050608;color:var(--ink);
  padding:10px 12px;font:inherit}
button{font:inherit}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#151821;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#01080e;font-weight:600}
.btn:disabled{opacity:.5}
.err{color:var(--fault);font:12px var(--mono);min-height:1em}
.muted{color:var(--ink-3);font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
nav button[aria-selected="true"]{background:#151821;color:var(--ink);border-color:#353a45}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#11141a;color:var(--ink);cursor:pointer}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--ink-3)}
dd{font-family:var(--mono);overflow-wrap:anywhere}
.turns{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
.bubble{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.you{align-self:flex-end;background:#16303a}
.bubble.jarvis{align-self:flex-start;background:#161921}
.bubble.note{align-self:center;color:var(--ink-3);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row textarea{flex:1;resize:none}
.btn.rec{background:var(--fault);border-color:var(--fault)}
label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
label.check input{width:auto;min-height:0}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-3);font:12px var(--mono)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1>JARVIS</h1>
    <span id="link" class="pill"><i class="led"></i><span id="linkText">CONNECTING</span></span>
  </header>

  <!-- Not paired: one code from the desktop (Connect -> Phone) unlocks the rest. -->
  <section id="pairView" class="card" hidden>
    <h2>Pair with JARVIS</h2>
    <p class="muted">On the laptop: Connect → Phone → show a code. Type it here, or scan its QR code.</p>
    <input id="pairCode" type="text" autocomplete="one-time-code" autocapitalize="characters" placeholder="ABCD-EFGH" aria-label="Pairing code">
    <input id="pairName" type="text" maxlength="40" aria-label="Name for this phone">
    <button id="pairBtn" class="btn primary" type="button">Pair</button>
    <div id="pairErr" class="err" role="alert"></div>
  </section>

  <div id="paired" hidden>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <label class="check"><input id="relaysOnly" type="checkbox"> Relays only</label>
      <span id="modeName" class="muted"></span>
    </div>

    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="room" aria-selected="true">Room</button>
      <button role="tab" data-tab="aankhen" aria-selected="false">Aankhen</button>
      <button role="tab" data-tab="talk" aria-selected="false">Talk</button>
    </nav>

    <section id="tab-room" class="card" style="margin-top:12px">
      <div id="modesBox">
        <h2>Modes</h2>
        <div id="scenes" class="chips" style="margin-top:8px"></div>
      </div>
      <h2>Relays</h2>
      <div id="relays" class="relays"></div>
      <p class="muted">Cyan: the board confirms it. Amber: sent, waiting for the board.</p>
    </section>

    <section id="tab-aankhen" class="card" style="margin-top:12px" hidden>
      <h2>Aankhen</h2>
      <dl id="aankhen"></dl>
      <p id="aankhenNote" class="muted"></p>
    </section>

    <section id="tab-talk" class="card" style="margin-top:12px" hidden>
      <div class="row" style="justify-content:space-between">
        <h2>Talk</h2>
        <span id="coreState" class="pill"><i class="led"></i><span>OFFLINE</span></span>
      </div>
      <div id="wakePrompt" class="row" hidden>
        <span class="muted" style="flex:1">JARVIS is asleep.</span>
        <button class="btn" type="button" data-wake="text">Wake (text)</button>
        <button class="btn primary" type="button" data-wake="voice">Wake (voice)</button>
      </div>
      <div id="turns" class="turns" aria-live="polite"></div>
      <div class="row">
        <textarea id="msg" rows="1" placeholder="Message JARVIS" aria-label="Message"></textarea>
        <button id="mic" class="btn" type="button" aria-label="Record a voice message">Mic</button>
        <button id="send" class="btn primary" type="button">Send</button>
      </div>
      <div class="row" style="justify-content:space-between">
        <label class="check"><input id="speakHere" type="checkbox"> Speak replies here</label>
        <span id="recInfo" class="muted"></span>
      </div>
    </section>
    <div id="err" class="err" role="alert" style="margin-top:10px"></div>
  </div>

  <footer id="foot" hidden>
    <span id="devName">PHONE</span>
    <button id="unpair" class="btn" type="button">Unpair this phone</button>
  </footer>
</main>
<script src="/phone/relays.js"></script>
<script src="/phone/app.js"></script>
</body>
</html>
