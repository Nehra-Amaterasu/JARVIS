[pytest]
# Each part keeps its own suite; from this folder:
#   .venv\Scripts\python.exe -m pytest aankhen/tests
#   .venv\Scripts\python.exe -m pytest crew/tests
#   cd app  then  ..\.venv\Scripts\python.exe -m pytest tests
# legacy/ folders hold first-generation scripts named test_*.py that talk to servers
# that no longer exist; data/ and mission-germoney/ are not Python test code.
norecursedirs = legacy data mission-germoney node_modules .venv .git dist
